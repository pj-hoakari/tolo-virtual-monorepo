# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
    pull:
        desc: Pull every cloned repository and report the ones that failed.
        silent: true
        cmds:
            - |
              failed=""
              for d in */; do
                d=${d%/}
                [ -e "$d/.git" ] || continue
                echo "== $d"
                git -C "$d" pull --ff-only || failed="$failed $d"
              done
              if [ -n "$failed" ]; then
                echo "pull failed:$failed" >&2
                exit 1
              fi

    clone:core:
        desc: Clone every repository except the PoCs.
        deps:
            - clone:web
            - clone:backend
            - clone:mobile
            - clone:infra

    clone:web:
        desc: Clone hoakari-root and the web repositories.
        deps:
            - clone:hoakari-root
            - clone:tolo-web
            - clone:web-crowd-detection-utils

    clone:backend:
        desc: Clone hoakari-root and the backend services and libraries.
        deps:
            - clone:hoakari-root
            - clone:tolo-service-gateway
            - clone:tolo-tenant-management
            - clone:tolo-graph-authoring
            - clone:tolo-observation
            - clone:tolo-operation
            - clone:tolo-flow-control
            - clone:tolo-edge-bridge
            - clone:tolo-guest
            - clone:tolo-realtime
            - clone:tolo-idp
            - clone:tolo-relation-stub
            - clone:tolo-kernel-proto
            - clone:internal-jwt-handling
            - clone:protoc-gen-authz-go
            - clone:jetstream-http-push
            - clone:go-service-template

    clone:mobile:
        desc: Clone hoakari-root and the mobile app.
        deps:
            - clone:hoakari-root
            - clone:tolo-staff-app

    clone:infra:
        desc: Clone hoakari-root and the integration, deployment and CI repositories.
        deps:
            - clone:hoakari-root
            - clone:tolo
            - clone:tolo-manifest
            - clone:actions
            - clone:renovate-config

    clone:poc:
        desc: Clone hoakari-root and the PoC and experiment repositories.
        deps:
            - clone:hoakari-root
            - clone:tolo-burst-observation-poc
            - clone:tolo-walk-calibration-poc
            - clone:guide-map-poc
            - clone:tolo-communication-poc
            - clone:grid-canvas-poc
            - clone:yolo_person_finetuning_colab
            - clone:esp-edge-device

    clone:hoakari-root:
        desc: Clone pj-hoakari/hoakari-root.
        cmds:
            - task: _clone
              vars: { REPO: hoakari-root }

    clone:tolo-web:
        desc: Clone pj-hoakari/tolo-web.
        cmds:
            - task: _clone
